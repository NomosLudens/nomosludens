<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">Nomos Ludens</title>
  <desc id="desc">Minimal stone banner for the Nomos Ludens GitHub profile.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#efe7dc"/>
      <stop offset="55%" stop-color="#ddd2c2"/>
      <stop offset="100%" stop-color="#c8baa8"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="14" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.08"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="engrave" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feOffset in="blur" dx="2" dy="2" result="shadow1"/>
      <feOffset in="blur" dx="-1.2" dy="-1.2" result="shadow2"/>
      <feFlood flood-color="#6f665c" flood-opacity="0.55" result="dark"/>
      <feFlood flood-color="#faf4eb" flood-opacity="0.6" result="light"/>
      <feComposite in="dark" in2="shadow1" operator="in" result="darkComp"/>
      <feComposite in="light" in2="shadow2" operator="in" result="lightComp"/>
      <feMerge>
        <feMergeNode in="darkComp"/>
        <feMergeNode in="lightComp"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1600" height="420" fill="url(#paper)"/>
  <rect width="1600" height="420" fill="transparent" filter="url(#grain)"/>
  <g opacity="0.18" stroke="#8a7c6f" stroke-width="1.2" fill="none">
    <path d="M70 95 C190 55 305 78 420 48"/>
    <path d="M1040 72 C1160 98 1260 86 1440 120"/>
    <path d="M1180 310 C1300 270 1440 285 1550 240"/>
  </g>
  <g fill="#322d28">
    <text x="85" y="110" font-family="Georgia, 'Times New Roman', serif" font-size="30" letter-spacing="9">NOMOS LUDENS</text>
    <text x="88" y="158" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="8">PLAY · BUILD · BELONG</text>
  </g>
  <g filter="url(#engrave)" fill="none" stroke="#4a443d" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M800 86 L800 334"/>
    <path d="M702 92 L650 146 L692 205 L650 264 L702 328"/>
    <path d="M898 92 L950 146 L908 205 L950 264 L898 328"/>
  </g>
  <g fill="#4a433d">
    <text x="980" y="205" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="5">ANCIENT</text>
    <text x="980" y="235" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="5">QUESTIONS</text>
    <text x="980" y="265" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" letter-spacing="5">MODERN TOOLS</text>
  </g>
  <g fill="#2e2925">
    <text x="1230" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="36">Technology</text>
    <text x="1230" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="36">for human agency.</text>
    <rect x="1230" y="245" width="70" height="2" fill="#9f8367"/>
    <text x="1230" y="292" font-family="Georgia, 'Times New Roman', serif" font-size="24">Empower, not replace.</text>
  </g>
</svg>