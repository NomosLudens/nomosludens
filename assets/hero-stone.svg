<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Nomos Ludens</title>
  <desc id="desc">Stone-inspired banner with the Nomos Ludens glyph and the phrase Technology for human agency.</desc>
  <defs>
    <linearGradient id="stone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8e1d5"/>
      <stop offset="52%" stop-color="#d8cfc0"/>
      <stop offset="100%" stop-color="#c3b7a6"/>
    </linearGradient>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.11"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="engrave" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="blur"/>
      <feOffset dx="2" dy="2" result="dark"/>
      <feOffset dx="-1.5" dy="-1.5" result="light"/>
      <feFlood flood-color="#6b6257" flood-opacity="0.85" result="darkColor"/>
      <feFlood flood-color="#fffaf0" flood-opacity="0.55" result="lightColor"/>
      <feComposite in="darkColor" in2="dark" operator="in" result="darkShadow"/>
      <feComposite in="lightColor" in2="light" operator="in" result="lightShadow"/>
      <feMerge>
        <feMergeNode in="darkShadow"/>
        <feMergeNode in="lightShadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#stone)"/>
  <rect width="1200" height="360" fill="transparent" filter="url(#grain)"/>

  <g opacity="0.28" stroke="#8f8477" stroke-width="1">
    <path d="M90 74 C260 40 350 58 462 26"/>
    <path d="M735 302 C860 268 980 284 1110 236"/>
    <path d="M820 66 C936 104 1015 88 1140 120"/>
  </g>

  <g transform="translate(0,0)" filter="url(#engrave)" fill="none" stroke="#3f3a34" stroke-width="18" stroke-linecap="square" stroke-linejoin="miter">
    <path d="M600 82 L600 278"/>
    <path d="M500 86 L452 134 L490 178 L452 222 L500 274"/>
    <path d="M700 86 L748 134 L710 178 L748 222 L700 274"/>
  </g>

  <g fill="#2f2b27">
    <text x="82" y="95" font-family="Georgia, 'Times New Roman', serif" font-size="28" letter-spacing="9">NOMOS LUDENS</text>
    <text x="84" y="132" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="4">TECHNOLOGY FOR HUMAN AGENCY</text>
  </g>

  <g fill="#2f2b27" text-anchor="end">
    <text x="1118" y="270" font-family="Georgia, 'Times New Roman', serif" font-size="26">Empower, not replace.</text>
    <rect x="1044" y="288" width="74" height="2" fill="#8a7259"/>
  </g>
</svg>